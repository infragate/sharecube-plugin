name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Manifests agree with each other
        run: node scripts/check-manifests.mjs

      # The schema URLs in $schema do not resolve, so fetch them from the spec repo.
      - name: Agent Plugins 1.0.0 schemas
        run: |
          base=https://raw.githubusercontent.com/agentplugins/agent-plugins-spec/main/schemas/1.0.0
          curl -fsSL "$base/plugin.schema.json" -o "$RUNNER_TEMP/plugin.schema.json"
          curl -fsSL "$base/mcp.schema.json" -o "$RUNNER_TEMP/mcp.schema.json"
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/plugin.schema.json" -d plugin.json
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/mcp.schema.json" -d mcp.json

      # Cursor's own validator from cursor/plugin-template, pinned to a commit.
      - name: Cursor plugin and marketplace
        run: |
          curl -fsSL https://raw.githubusercontent.com/cursor/plugin-template/46216072ac5750f782f95bb325b4d12b7c3ae9c9/scripts/validate-template.mjs -o "$RUNNER_TEMP/validate-cursor.mjs"
          node "$RUNNER_TEMP/validate-cursor.mjs"

      - name: Claude Code plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code plugin validate .

      # Installs the plugin with the real Codex CLI. Codex rejects manifests
      # that only other validators accept, such as an unsupported $schema.
      - name: Codex marketplace and plugin install
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.160.0 plugin marketplace add "$PWD"
          npx --yes @openai/codex@0.160.0 plugin add sharecube@sharecube
          npx --yes @openai/codex@0.160.0 mcp list | grep -q 'https://app.sharecube.io/mcp'
